<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog — Vinyl Hilmi</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream:#F5EFE6; --cream-soft:#FBF7F0; --brown-deep:#3E2C23;
            --brown-warm:#6B4A36; --terracotta:#C96A4B; --terracotta-d:#A4512F;
            --mustard:#D9A441; --olive:#7A8450; --border:#E4D8C7; --text-muted:#7A6A5D;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:var(--cream); color:var(--brown-deep); line-height:1.6; padding:20px; }
        h1,h2 { font-family:'DM Serif Display',serif; font-weight:400; }

        .page-head { margin-bottom: 22px; }
        .page-head h1 { font-size: 2rem; }
        .page-head p { color: var(--text-muted); font-size: 14px; }

        .filters {
            display: flex; flex-wrap: wrap; gap: 10px;
            padding: 16px;
            background: var(--cream-soft);
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 24px;
            align-items: center;
        }
        .filters label { font-size: 13px; font-weight: 600; }
        .filters select {
            padding: 8px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: #fff;
            font-family: inherit;
            font-size: 13px;
            color: var(--brown-deep);
            cursor: pointer;
        }
        .filters select:focus { outline: none; border-color: var(--terracotta); }
        .filters .count { margin-left:auto; font-size:13px; color:var(--text-muted); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
        }
        .card {
            background: var(--cream-soft);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            transition: 0.3s;
            animation: fadeUp 0.5s ease-out backwards;
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 14px 30px rgba(62,44,35,0.15); }
        @keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform:none; } }

        .card-img { display:block; aspect-ratio:1/1; overflow:hidden; background:#ddd; position:relative; }
        .card-img img { width:100%; height:100%; object-fit:cover; transition: transform 0.5s; }
        .card:hover .card-img img { transform: scale(1.06); }
        .card-img .overlay {
            position:absolute; inset:0; background: rgba(62,44,35,0.55);
            display:flex; align-items:center; justify-content:center;
            color:#fff; font-weight:600; font-size:13px;
            opacity:0; transition:0.3s;
        }
        .card:hover .card-img .overlay { opacity: 1; }

        .card-body { padding: 14px 16px; flex:1; display:flex; flex-direction:column; }
        .card-body h3 { font-size: 1rem; margin-bottom: 4px; }
        .meta { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
        .tags { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag {
            font-size: 11px; padding: 2px 8px; border-radius: 20px;
            background: var(--mustard); color: var(--brown-deep);
            font-weight: 600;
        }
        .tag.genre { background: var(--olive); color:#fff; }
        .price { color: var(--terracotta); font-weight: 700; font-size: 1.05rem; margin-bottom: 10px; margin-top:auto; }

        .btn-wa {
            display: block; text-align: center;
            background: #25D366; color: #fff;
            padding: 9px; border-radius: 8px;
            text-decoration: none; font-size: 13px; font-weight: 600;
            transition: 0.25s;
        }
        .btn-wa:hover { background: #1eb956; }

        .no-result { text-align:center; padding:40px; color: var(--text-muted); font-size: 14px; }
    </style>
</head>

        </select>

        <label for="filterKondisi">Kondisi:</label>

            <option value="">Semua</option>
            <option value="Near Mint">Near Mint</option>
            <option value="Very Good+">Very Good+</option>
            <option value="Very Good">Very Good</option>
        </select>

        <span class="count" id="count">0 produk</span>
    </div>

        function rupiah(n) { return "Rp " + n.toLocaleString('id-ID'); }

        function render() {
            const g = document.getElementById('filterGenre').value;
            const k = document.getElementById('filterKondisi').value;
            const data = produk.filter(p => (!g || p.genre === g) && (!k || p.kondisi === k));

            const grid = document.getElementById('grid');
            grid.innerHTML = data.map(p => {
                const waMsg = encodeURIComponent(`Halo Vinyl Hilmi, saya tertarik dengan "${p.judul}" (${p.genre}, ${p.kondisi}) - ${rupiah(p.harga)}. Masih tersedia?`);
                return `
                <div class="card">
                    <a class="card-img" href="${p.link}" target="_blank" rel="noopener">
                        <img src="${p.img}" alt="${p.judul}" onerror="this.style.display='none';this.parentElement.style.background='linear-gradient(135deg,#D9A441,#7A8450)'">
                        <span class="overlay">Lihat di Marketplace →</span>
                    </a>
                    <div class="card-body">
                        <h3>${p.judul}</h3>
                        <p class="meta">${p.tahun}</p>
                        <div class="tags">
                            <span class="tag genre">${p.genre}</span>
                            <span class="tag">${p.kondisi}</span>
                        </div>
                        <p class="price">${rupiah(p.harga)}</p>
                        <a class="btn-wa" href="https://wa.me/${WA}?text=${waMsg}" target="_blank" rel="noopener">💬 Tanya via WhatsApp</a>
                    </div>
                </div>`;
            }).join('');

            document.getElementById('count').textContent = data.length + " produk";
            if (!data.length) grid.innerHTML = '<p class="no-result" style="grid-column:1/-1;">Tidak ada produk yang cocok dengan filter.</p>';
        }

        document.getElementById('filterGenre').addEventListener('change', render);
        document.getElementById('filterKondisi').addEventListener('change', render);
        render();
